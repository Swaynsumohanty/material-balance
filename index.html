<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Balance Solver | Process Lab</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#17243a;--muted:#64748b;--line:#dce4ef;--blue:#2457d6;--blue2:#eaf0ff;--green:#13845b;--red:#bd3434;--amber:#9a6500;--shadow:0 12px 35px rgba(22,42,76,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1180px;margin:28px auto;padding:0 20px 55px}
.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.intro h1{font-size:29px;line-height:1.15;margin:0}
.steps{display:flex;gap:8px;margin:22px 0;position:sticky;top:0;z-index:4;background:var(--bg);padding:9px 0}.step{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-align:center}.step.active{border-color:var(--blue);background:var(--blue2);color:var(--blue);font-weight:700}.step.done{color:var(--green);border-color:#b9e4d2}
.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:18px;align-items:stretch}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}.layout>.card{height:100%;margin-bottom:0}.card h2{font-size:18px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 19px}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}.field label,.field-label{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:6px}.field input,.field select,.cell-input,.name-input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);font:inherit;min-width:0}.field input:focus,.cell-input:focus,.name-input:focus{outline:3px solid #dce6ff;border-color:var(--blue)}
.diagram{background:linear-gradient(135deg,#f7f9ff,#eef3fc);border:1px solid #e0e8f5;border-radius:14px;padding:12px;overflow:hidden;min-height:340px;display:flex;flex-direction:column;justify-content:space-between}.diagram svg{width:100%;height:auto;display:block}.diagram-caption{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:3px}
.btn-row{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.submit-wrap{display:flex;justify-content:center;margin:28px 0 36px}.submit-btn{min-width:240px;padding:14px 24px;font-size:15px;box-shadow:0 8px 18px rgba(36,87,214,.2)}.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#eef2f8;color:#263650}.ghost{background:#fff;border:1px solid var(--line);color:#334155}.btn:disabled{opacity:.45;cursor:not-allowed}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.pill{font-size:12px;padding:5px 9px;border-radius:99px;background:var(--blue2);color:var(--blue);font-weight:700}
.species-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.species-item{border:1px solid var(--line);padding:10px;border-radius:10px}.species-item label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.stream-block,.reaction-block{border:1px solid var(--line);border-radius:13px;padding:15px;margin:12px 0}.stream-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #edf1f6;font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}.cell-input{padding:8px;font-size:13px}.reaction-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.reaction-grid .field input{padding:8px}


.hidden{display:none!important}\nsection{scroll-margin-top:82px}\n#panel2,#panel3{margin-top:22px}.note{font-size:12px;color:var(--muted);margin-top:12px}.toast{position:fixed;right:20px;bottom:20px;background:#17243a;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:5}
footer{text-align:center;color:#8290a5;font-size:12px;margin-top:10px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.layout>.card{height:auto}.diagram{min-height:260px}.field-grid{grid-template-columns:repeat(2,1fr)}.intro{align-items:start;flex-direction:column}}
@media(max-width:520px){main{padding:0 13px 35px;margin-top:20px}.field-grid{grid-template-columns:1fr 1fr}.card{padding:16px}.field-grid{grid-template-columns:1fr 1fr}.steps{gap:5px}.step{padding:9px 7px;font-size:11px}.intro h1{font-size:24px}}

/* Alternate theme: Midnight Process Control */
:root{
 --bg:#0b1422;--panel:#121f31;--ink:#edf4fb;--muted:#9aadc2;--line:#2a3c53;
 --blue:#53d6c5;--blue2:#173b43;--green:#f0ad72;--red:#ff7b82;--amber:#f0c16c;
 --shadow:0 18px 42px rgba(0,0,0,.22)
}
body{background:radial-gradient(ellipse at 12% 0%,#172b40 0%,#0b1422 48%);color:var(--ink)}
main{max-width:1240px;margin:26px auto;padding:0 22px 60px}
.intro h1{font-size:31px;letter-spacing:-.7px;color:#f5f8fc}
.steps{background:rgba(11,20,34,.94);backdrop-filter:blur(12px);border-bottom:1px solid #26384e;padding:12px 0}
.step{background:#142338;border:1px solid #2b405a;color:#9aadc2;border-radius:8px;padding:12px 14px;letter-spacing:.2px}
.step.active{background:#153b40;border-color:#53d6c5;color:#8af0e3;box-shadow:inset 0 -2px 0 #53d6c5}
.step.done{background:#172d34;border-color:#38645f;color:#8ce0c9}
.card{background:linear-gradient(145deg,#15243a,#111d2e);border:1px solid #2a3d55;border-radius:13px;padding:23px;box-shadow:var(--shadow)}
.card h2{font-size:17px;letter-spacing:.1px;color:#f0f5fb}
.sub,.note{color:#93a7bd}
.field label,.field-label{color:#a9bbcf}
.field input,.field select,.cell-input,.name-input{
 background:#0c1929;border:1px solid #30445d;color:#eaf2fa;border-radius:8px
}
.field input:focus,.cell-input:focus,.name-input:focus{outline:3px solid rgba(83,214,197,.16);border-color:#53d6c5}
.field input::placeholder,.cell-input::placeholder,.name-input::placeholder{color:#6f849c}
.diagram{background:linear-gradient(145deg,#0d1b2d,#172a40);border:1px solid #2d4960;border-radius:11px}
.diagram-caption{color:#9aadc2}
.pill{background:#173b43;color:#8af0e3;border:1px solid #285b60}
.species-item,.stream-block,.reaction-block,
.species-item label{color:#9aadc2}
.stream-title{color:#eaf2fa}
th{color:#9aadc2}
td{border-bottom-color:#26384d;color:#d7e2ed}
.cell-input{background:#0a1727}






.btn{border-radius:8px}
.primary{background:#53d6c5;color:#08211f}
.secondary{background:#20334a;color:#d8e4ef}
.ghost{background:#13243a;border-color:#344b65;color:#d8e4ef}
.submit-btn{box-shadow:0 9px 22px rgba(83,214,197,.16)}
.toast{background:#e8f7f5;color:#102b2a}
@media(max-width:850px){main{padding:0 16px 45px}}
@media(max-width:520px){main{padding:0 12px 35px}.intro h1{font-size:25px}.card{padding:16px}}

</style>
</head>
<body>
<main>
  <div class="intro"><div><h1>Material Balance Solver</h1></div></div>
  <nav class="steps" aria-label="Solver stages"><button type="button" class="step active" id="step1">01 · Configure</button><button type="button" class="step" id="step2">02 · Define system</button></nav>

  <section id="panel1">
    <div class="layout">
      <div class="card config-card">
        <h2>01 · System configuration</h2>
        <div class="field-grid">
          <div class="field"><label for="nc">Number of species (Nc)</label><input id="nc" type="number" min="1" max="12" value="3"></div>
          <div class="field"><label for="nin">Input streams (Nin)</label><input id="nin" type="number" min="0" max="8" value="2"></div>
          <div class="field"><label for="nout">Output streams (Nout)</label><input id="nout" type="number" min="0" max="8" value="2"></div>
          <div class="field"><label for="nr">Number of reactions (Nr)</label><input id="nr" type="number" min="0" max="8" value="1"></div>
        </div>
        
      </div>
      <div class="card"><h2>Live reactor diagram</h2>
        <div class="diagram"><svg id="reactorSvg" viewBox="0 0 560 300" role="img" aria-label="Reactor with dynamic input and output stream arrows"></svg><div class="diagram-caption"><span id="inCaption">2 input streams</span><span id="outCaption">2 output streams</span></div></div>
      </div>
    </div>
  </section>

  <section id="panel2">
    <div class="card">
      <div class="section-head"><h2>02 · Species</h2><span class="pill" id="speciesCount">3 species</span></div>
      <div id="speciesNames" class="species-list"></div>
    </div>
    <div class="card">
      <div class="section-head"><h2>03 · Stream editor</h2><span class="pill">Flow rates</span></div>
      <div id="streamEditors"></div>
      
    </div>
    <div class="card">
      <div class="section-head"><h2>04 · Reaction editor</h2><span class="pill" id="reactionCount">1 reaction</span></div>
      <div id="reactionEditors"></div>
      
    </div>
    <div class="submit-wrap"><button class="btn primary submit-btn" id="submitModel">Save system configuration</button></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let config={nc:3,nin:2,nout:2,nr:1},species=["A","B","C"],streamValues={},reactions=[];
const clamp=(v,min,max)=>Math.max(min,Math.min(max,Number.isFinite(v)?v:min));
function readConfig(){return {nc:clamp(+$("nc").value,1,12),nin:clamp(+$("nin").value,0,8),nout:clamp(+$("nout").value,0,8),nr:clamp(+$("nr").value,0,8)}}
function showToast(msg){$("toast").textContent=msg;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
function drawReactor(){
 const c=readConfig(),svg=$("reactorSvg"),yIn=c.nin?Array.from({length:c.nin},(_,i)=>150+(i-(c.nin-1)/2)*Math.min(34,130/Math.max(1,c.nin-1))):[],yOut=c.nout?Array.from({length:c.nout},(_,i)=>150+(i-(c.nout-1)/2)*Math.min(34,130/Math.max(1,c.nout-1))):[];
 let s=`<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#53d6c5"/></marker></defs><rect x="205" y="82" width="150" height="136" rx="15" fill="#172a40" stroke="#53d6c5" stroke-width="3"/><text x="280" y="145" text-anchor="middle" font-size="21" font-weight="700" fill="#edf4fb">REACTOR</text><text x="280" y="169" text-anchor="middle" font-size="12" fill="#9aadc2">${c.nc} species · ${c.nr} reactions</text>`;
 yIn.forEach((y,i)=>{s+=`<path d="M20 ${y} H198" stroke="#53d6c5" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="20" y="${y-9}" font-size="11" fill="#9aadc2">IN ${i+1}</text>`});
 yOut.forEach((y,i)=>{s+=`<path d="M362 ${y} H540" stroke="#f0ad72" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="493" y="${y-9}" font-size="11" fill="#9aadc2">OUT ${i+1}</text>`});
 if(!c.nin)s+=`<text x="100" y="150" text-anchor="middle" font-size="12" fill="#94a3b8">No inputs</text>`;
 if(!c.nout)s+=`<text x="450" y="150" text-anchor="middle" font-size="12" fill="#94a3b8">No outputs</text>`;
 svg.innerHTML=s;$("inCaption").textContent=`${c.nin} input stream${c.nin===1?"":"s"}`;$("outCaption").textContent=`${c.nout} output stream${c.nout===1?"":"s"}`;
}
function key(stream,sp){return `${stream}::${sp}`}
function saveStreamInputs(){document.querySelectorAll("[data-stream][data-species]").forEach(el=>{streamValues[key(el.dataset.stream,el.dataset.species)]=el.value})}
function saveReactionInputs(){
 document.querySelectorAll("[data-rx][data-kind][data-species]").forEach(el=>{const r=+el.dataset.rx,k=el.dataset.kind,sp=el.dataset.species;reactions[r]??={order:{},stoich:{},conversion:""};reactions[r][k][sp]=el.value});
 document.querySelectorAll("[data-rx-conversion]").forEach(el=>{const r=+el.dataset.rxConversion;reactions[r]??={order:{},stoich:{},conversion:""};reactions[r].conversion=el.value});
}
function renderSpecies(){
 $("speciesCount").textContent=`${config.nc} species`;
 $("speciesNames").innerHTML=species.map((sp,i)=>`<div class="species-item"><label>Species ${i+1}</label><input class="name-input" data-species-name="${i}" value="${escapeHtml(sp)}" aria-label="Species ${i+1} name"></div>`).join("");
}
function renderStreams(){
 const blocks=[];
 [["Input",config.nin],["Output",config.nout]].forEach(([type,n])=>{for(let i=0;i<n;i++){
 const id=`${type.toLowerCase()}-${i+1}`;
 blocks.push(`<div class="stream-block"><div class="stream-title"><span>${type} stream ${i+1}</span><span class="pill">${id}</span></div><div class="table-wrap"><table><thead><tr><th>Species</th><th>Component flow rate</th><th>Unit (optional)</th></tr></thead><tbody>${species.map((sp,j)=>`<tr><td>${escapeHtml(sp)}</td><td><input class="cell-input" type="number" step="any" placeholder="Unknown / blank" data-stream="${id}" data-species="${j}" value="${escapeAttr(streamValues[key(id,j)]??"")}"></td><td><span style="color:#94a3b8">e.g. mol/s</span></td></tr>`).join("")}</tbody></table></div></div>`);
 }});
 $("streamEditors").innerHTML=blocks.length?blocks.join(""):`<p class="note">No streams configured. Increase Nin or Nout to add streams.</p>`;
}
function renderReactions(){
 $("reactionCount").textContent=`${config.nr} reaction${config.nr===1?"":"s"}`;
 $("reactionEditors").innerHTML=Array.from({length:config.nr},(_,r)=>{const rx=reactions[r]??={order:{},stoich:{},conversion:""};return `<div class="reaction-block"><div class="stream-title"><span>Reaction ${r+1}</span><span class="pill">R${r+1}</span></div><div class="reaction-grid"><div class="field"><label>Conversion (%)</label><input class="cell-input" type="number" min="0" max="100" step="any" placeholder="e.g. 75" data-rx-conversion="${r}" value="${escapeAttr(rx.conversion??"")}"></div><div class="field"><label>Reaction note (optional)</label><input class="cell-input" placeholder="e.g. A converts to B" value="${escapeAttr(rx.note??"")}" data-rx-note="${r}"></div></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Species</th><th>Reaction order</th><th>Stoichiometric coefficient</th></tr></thead><tbody>${species.map((sp,j)=>`<tr><td>${escapeHtml(sp)}</td><td><input class="cell-input" type="number" step="any" placeholder="Order" data-rx="${r}" data-kind="order" data-species="${j}" value="${escapeAttr(rx.order?.[j]??"")}"></td><td><input class="cell-input" type="number" step="any" placeholder="ν (negative reactant, positive product)" data-rx="${r}" data-kind="stoich" data-species="${j}" value="${escapeAttr(rx.stoich?.[j]??"")}"></td></tr>`).join("")}</tbody></table></div></div>`}).join("")||`<p class="note">No reactions configured.</p>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function go(n){
 [1,2].forEach(i=>$(`step${i}`).classList.toggle("active",i===n));
 const target=$(`panel${n}`);
 if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
}
function syncConfiguration(){
 saveStreamInputs(); saveReactionInputs();
 document.querySelectorAll("[data-species-name]").forEach(el=>{
   const i=+el.dataset.speciesName;
   species[i]=el.value.trim()||`Species ${i+1}`;
 });
 const next=readConfig();
 const oldSpecies=[...species];
 species=Array.from({length:next.nc},(_,i)=>oldSpecies[i]??`Species ${i+1}`);
 config=next;
 renderSpecies(); renderStreams(); renderReactions(); drawReactor();
}
["nc","nin","nout","nr"].forEach(id=>{
  $(id).addEventListener("input",drawReactor);
  $(id).addEventListener("change",syncConfiguration);
 });
[1,2].forEach(i=>$(`step${i}`).addEventListener("click",()=>go(i)));
$("submitModel").addEventListener("click",()=>{
 saveStreamInputs(); saveReactionInputs();
 document.querySelectorAll("[data-species-name]").forEach(el=>{const i=+el.dataset.speciesName;species[i]=el.value.trim()||`Species ${i+1}`});
 showToast("System configuration saved.");
});
drawReactor();renderSpecies();renderStreams();renderReactions();
</script>
</body>
</html>
